name: Ubuntu

on:
  push:
    branches: [ "next", "master", "ci" ]
  pull_request:
    branches: [ "next", "master" ]

env:
  CC: gcc
  # Not every Ubuntu release packages SDL3 and SDL3_mixer, so they're built from source
  SDL3_VERSION: 3.4.0
  SDL3_MIXER_VERSION: 3.2.4

jobs:
  build:
    continue-on-error: true
    strategy:
      matrix:
        arch:
          - runner: ubuntu-latest
            name: x86_64
          - runner: ubuntu-24.04-arm
            name: aarch64

    name: ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.runner }}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install dependencies
      run: |
       sudo apt-get update
       sudo apt install -y libpng-dev libcurl4-openssl-dev libgme-dev libminiupnpc-dev libopenmpt-dev
       # SDL3 (video, audio and input backends) and SDL3_mixer (audio formats) build dependencies
       sudo apt install -y cmake ninja-build pkg-config \
         libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-dev libsndio-dev \
         libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
         libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev \
         libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
         libvorbis-dev libopusfile-dev libflac-dev libmpg123-dev libxmp-dev libfluidsynth-dev

    - name: Build SDL3 and SDL3_mixer
      run: |
       curl -sSfL https://github.com/libsdl-org/SDL/releases/download/release-$SDL3_VERSION/SDL3-$SDL3_VERSION.tar.gz | tar -xz
       cmake -S SDL3-$SDL3_VERSION -B SDL3-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
       sudo cmake --build SDL3-build --target install
       curl -sSfL https://github.com/libsdl-org/SDL_mixer/releases/download/release-$SDL3_MIXER_VERSION/SDL3_mixer-$SDL3_MIXER_VERSION.tar.gz | tar -xz
       cmake -S SDL3_mixer-$SDL3_MIXER_VERSION -B SDL3_mixer-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDLMIXER_TESTS=OFF -DSDLMIXER_EXAMPLES=OFF
       sudo cmake --build SDL3_mixer-build --target install
       sudo ldconfig

    - name: Build SRB2 Legacy
      run: make -C src/ --keep-going -j$(nproc) LINUX64=1

    - name: Build SRB2 Legacy (dedicated)
      run: make -C src/ --keep-going -j$(nproc) LINUX64=1 DEDICATED=1

    - name: Package SRB2 Legacy AppImage
      run: |
       chmod +x srb2-legacy-appimage.sh
       if [[ "${{ github.ref == 'refs/heads/master' }}" == "true" ]]; then
           ./srb2-legacy-appimage.sh --skipbuild
       else
           ./srb2-legacy-appimage.sh --noassets --skipbuild
       fi

    - name: Upload build artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: srb2legacy-linux-${{ matrix.arch.name }}-${{ github.sha }}
        path: |
          bin/
          src/comptime.h

    - name: Upload Appimage artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: srb2legacy-appimage-${{ matrix.arch.name }}-${{ github.sha }}
        path: |
          SRB2_Legacy-${{ matrix.arch.name }}.AppImage
